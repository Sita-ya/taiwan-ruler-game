<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>台灣的尺：一個月生活挑戰</title>
<!-- 「加入主畫面」後從主畫面打開，就不會有網址列（iPad 用這個方法） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="台灣的尺">
<meta name="theme-color" content="#2B2D42">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="student">
  <div id="conn" class="s-conn" hidden>📡 連線中斷，正在重新連線…（不用擔心，連上後會回到原來的畫面）</div>
  <div id="root"></div>
  <div id="pause" class="pause-overlay" hidden>
    <div class="pause-in"><div class="pause-eyes">👀</div><div class="pause-t">眼睛看老師</div></div>
  </div>
  <div id="fsOverlay" class="fs-overlay" hidden>
    <button class="fs-btn" id="fsGo">👆 點一下<br>進入全螢幕<small>老師請大家把畫面放大</small></button>
  </div>
  <!-- iPad 不支援網頁全螢幕時：改教學生「加入主畫面」 -->
  <div id="iosTip" class="fs-overlay" hidden>
    <div class="ios-card">
      <div class="ios-t">📱 這台 iPad 要從「主畫面」開啟，才不會有網址列</div>
      <ol>
        <li>點畫面上方的 <b>分享</b> 圖示（方框加向上箭頭 ⬆️）</li>
        <li>往下找 <b>「加入主畫面」</b> → 右上角 <b>「新增」</b></li>
        <li>回到 iPad 主畫面，點 <b>「台灣的尺」</b> 圖示打開</li>
        <li>輸入老師投影幕上的 <b>房間代碼</b>，選回<b>同一個組別</b></li>
      </ol>
      <button class="btn big primary" id="iosOk">知道了</button>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="js/localdb.js"></script>
<script src="js/app.js"></script>
<script src="js/student.js"></script>
</body>
</html>
